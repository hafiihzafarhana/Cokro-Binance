basePath: /
host: localhost:8080
info:
  contact: {}
  description: API to interact with Binance public endpoints
  title: Binance API Service
  version: "1.0"
paths:
  /general/server-time:
    get:
      consumes:
      - application/json
      description: Check server time from Binance API
      produces:
      - application/json
      responses: {}
      summary: Check server time
      tags:
      - General
  /market/agregate-trade-lists:
    get:
      consumes:
      - application/json
      description: Check agregate trade list from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Number of entries to fetch (min: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Trade ID to fetch from (default: 0)'
        in: query
        name: fromId
        type: integer
      - description: Start time in RFC3339 format (e.g. 2025-10-14T00:00:00Z)
        in: query
        name: startTime
        type: string
      - description: End time in RFC3339 format (e.g. 2025-10-14T12:00:00Z)
        in: query
        name: endTime
        type: string
      - description: 'Time zone (default: UTC)'
        in: query
        name: timeZone
        type: string
      produces:
      - application/json
      responses: {}
      summary: Check agregate trade list
      tags:
      - Market
  /market/candlestick-data:
    get:
      consumes:
      - application/json
      description: Check candle stick data from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Number of entries to fetch (min: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: Start time in RFC3339 format (e.g. 2025-10-14T00:00:00Z)
        in: query
        name: startTime
        type: string
      - description: End time in RFC3339 format (e.g. 2025-10-14T12:00:00Z)
        in: query
        name: endTime
        type: string
      - description: Candle stick interval (e.g. 1m, 5m, 1h, 1d)
        enum:
        - 1m
        - 3m
        - 5m
        - 15m
        - 30m
        - 1h
        - 2h
        - 4h
        - 6h
        - 12h
        - 1d
        - 3d
        - 1w
        - 1M
        in: query
        name: interval
        required: true
        type: string
      - description: 'Time zone (default: UTC)'
        in: query
        name: timeZone
        type: string
      - description: 'Type of kline (default: klines)'
        enum:
        - klines
        - uiklines
        in: query
        name: typeKline
        type: string
      produces:
      - application/json
      responses: {}
      summary: Check candle stick data
      tags:
      - Market
  /market/current-average-price:
    get:
      consumes:
      - application/json
      description: Check current average price from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Check current average price
      tags:
      - Market
  /market/old-trade-lookup:
    get:
      consumes:
      - application/json
      description: Check old trade lookup from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Number of entries to fetch (min: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Trade ID to fetch from (default: 0)'
        in: query
        name: fromId
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Check old trade lookup
      tags:
      - Market
  /market/order-book:
    get:
      consumes:
      - application/json
      description: Check order book from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Number of entries to fetch (default: 100, min: 100, max: 5000)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Check order book
      tags:
      - Market
  /market/recent-trade-lists:
    get:
      consumes:
      - application/json
      description: Check recent trade list from Binance API
      parameters:
      - description: Trading pair symbol (e.g. BTCUSDT)
        in: query
        name: symbol
        required: true
        type: string
      - description: 'Number of entries to fetch (min: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses: {}
      summary: Check recent trade list
      tags:
      - Market
swagger: "2.0"
